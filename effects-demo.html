<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戦闘演出 | 三国志 英傑戦記</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/battle-effects.css"><style>body{min-height:100vh;background:radial-gradient(circle at center,#382719,#0b0806 65%);color:#f5e8c4}.demo{max-width:900px;margin:auto;padding:30px 20px}.demoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.demo button{min-height:70px;font:800 18px serif}.demo h1{font:900 42px serif;color:#f2d27d}@media(max-width:600px){.demoGrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="demo"><a href="index.html" style="color:#e7c87b">← 戦場へ</a><h1>戦闘演出試作</h1><p>固有必殺技カットインとダメージ演出のプレビュー。</p><div class="demoGrid" id="buttons"></div></main><script src="js/battle-effects.js"></script><script>const ids=[['liu','劉備'],['guan','関羽'],['zhang','張飛'],['zhao','趙雲'],['zhuge','諸葛亮'],['tian','田豫'],['cao','曹操'],['sima','司馬懿'],['lu','呂布']];const box=document.getElementById('buttons');ids.forEach(([id,n])=>{const b=document.createElement('button');b.textContent=n+' 必殺技';b.onclick=()=>EiketsuFX.special(id);box.appendChild(b)});const dmg=document.createElement('button');dmg.textContent='会心ダメージ';dmg.onclick=()=>EiketsuFX.damage(innerWidth/2,innerHeight/2,128,true);box.appendChild(dmg)</script></body></html>
