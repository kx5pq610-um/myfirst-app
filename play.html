<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三国志 英傑戦記 PLAY v22</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#f4e7c3;font-family:system-ui,"Yu Mincho",serif}.top{padding:10px 12px;background:linear-gradient(#291c11,#100c08);border-bottom:1px solid #8b6936;display:flex;justify-content:space-between;gap:8px;align-items:center}.top h1{font-size:19px;margin:0;color:#f0cc72}.wrap{max-width:1000px;margin:auto;padding:10px;display:grid;grid-template-columns:minmax(320px,1fr) 285px;gap:10px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:8/7;border:3px solid #5f4526;background:#24331e}.cell{position:relative;display:grid;place-items:center;border:1px solid #0005;user-select:none}.plain{background:#5c7042}.forest{background:#365239}.hill{background:#766342}.village{background:#80643d}.cell.move{box-shadow:inset 0 0 0 4px #66b9ff99}.cell.attack{box-shadow:inset 0 0 0 4px #ff655eaa}.unit{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(12px,3.8vw,22px);border:3px solid #e8cf8b;box-shadow:0 4px 10px #0008;transition:.15s}.ally{background:#275b39}.enemy{background:#7a2926}.boss{background:#8c401e;box-shadow:0 0 15px #ffb348}.selected{outline:4px solid #fff0a3}.hp{position:absolute;bottom:2px;left:8%;width:84%;height:5px;background:#260b0b}.hp i{display:block;height:100%;background:#77db6e}.side{display:grid;gap:9px;align-content:start}.panel{background:#17110c;border:1px solid #6c5333;border-radius:10px;padding:10px}.panel h2{font-size:16px;margin:0 0 7px;color:#edcb78}button{border:1px solid #8d6c3b;background:linear-gradient(#3a2919,#21170f);color:#ffe9b0;border-radius:8px;padding:10px;font-weight:800}button:disabled{opacity:.35}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.primary{background:linear-gradient(#7b4d19,#4c2d0d)}#log{height:145px;overflow:auto;font-size:12px;line-height:1.5}.turn{padding:4px 8px;border:1px solid #c29c52;border-radius:999px;color:#ffd978;font-size:12px}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:18px;z-index:20}.card{max-width:540px;background:linear-gradient(145deg,#302014,#100c08);border:2px solid #9b773f;border-radius:14px;padding:22px;text-align:center;box-shadow:0 20px 80px #000}.card h2{font-size:30px;color:#f2cf74}.hidden{display:none}.hint,.small{font-size:12px;color:#cdbf9f}.specialFx{animation:flash .55s}.levelup{color:#ffe16d;font-weight:900}.objective{padding:7px;background:#271c10;border-left:3px solid #d0a34f;font-size:12px;margin-bottom:8px}@keyframes flash{50%{filter:brightness(2.3);transform:scale(1.01)}}@media(max-width:720px){.wrap{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.panel:last-child{grid-column:1/-1}.board{width:100%}}@media(max-width:460px){.wrap{padding:5px;gap:5px}.side{grid-template-columns:1fr}.panel:last-child{grid-column:auto}.unit{border-width:2px}}</style></head><body><div class="top"><div><h1>三国志 英傑戦記</h1><small id="chapter">第一章　義勇軍、起つ</small></div><div id="turn" class="turn">自軍 TURN 1</div></div><main class="wrap"><div id="board" class="board"></div><aside class="side"><section class="panel"><div id="objective" class="objective">勝利条件：敵軍を全滅</div><h2>武将</h2><div id="info">味方武将を選択</div><div class="hint">味方→青マス移動→赤い敵を攻撃</div></section><section class="panel"><h2>行動</h2><div class="actions"><button id="attack" disabled>攻撃</button><button id="special" disabled>必殺技</button><button id="wait" disabled>待機</button><button id="end" class="primary">ターン終了</button><button id="save">セーブ</button><button id="reset">最初から</button></div></section><section class="panel"><h2>戦況</h2><div id="log"></div></section></aside></main><div id="intro" class="modal"><div class="card"><div id="year">184年　幽州</div><h2 id="introTitle">黄巾の乱</h2><p id="introText">乱世の中、劉備・関羽・張飛は民を守るため義勇軍を起こした。</p><p>敵将をすべて撃破せよ。</p><button id="start" class="primary">出陣する</button><button id="load">つづきから</button></div></div><div id="result" class="modal hidden"><div class="card"><h2 id="resultTitle">勝利！</h2><p id="resultText"></p><button id="next" class="primary">次の章へ</button><button id="retry">もう一度</button></div></div><script>const W=8,H=7;let stage=1,turn=1,phase='ally',sel=null,moved=false;const progress=JSON.parse(localStorage.getItem('eiketsuV22')||'{"stage":1,"heroes":{}}');const heroBase=[{id:'liu',n:'劉備',hp:110,atk:28,mv:3,sp:'仁徳の号令'},{id:'guan',n:'関羽',hp:120,atk:36,mv:3,sp:'青龍偃月斬'},{id:'zhang',n:'張飛',hp:125,atk:35,mv:3,sp:'蛇矛猛撃'}];let terrain=[],units=[];const B=document.querySelector('#board'),info=document.querySelector('#info'),log=document.querySelector('#log');function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function at(x,y){return units.find(u=>u.hp>0&&u.x===x&&u.y===y)}function msg(t,c=''){log.innerHTML=`<div class="${c}">› ${t}</div>`+log.innerHTML}function setup(s){stage=s;turn=1;phase='ally';sel=null;moved=false;terrain=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>(x===3&&y>1?'forest':(x===6&&y<3?'hill':(x===1&&y===1?'village':'plain')))));const pos=s===1?[[1,5],[2,5],[0,6]]:[[0,5],[1,6],[2,5]];units=heroBase.map((h,i)=>{const p=progress.heroes[h.id]||{lv:1,xp:0};return{...h,s:'ally',x:pos[i][0],y:pos[i][1],lv:p.lv,xp:p.xp,max:h.hp+(p.lv-1)*12,hp:h.hp+(p.lv-1)*12,atk:h.atk+(p.lv-1)*3}});if(s===1)units.push({id:'e1',n:'黄巾兵',s:'enemy',x:5,y:1,hp:65,max:65,atk:18,mv:2,xp:25},{id:'e2',n:'黄巾兵',s:'enemy',x:6,y:2,hp:65,max:65,atk:18,mv:2,xp:25},{id:'boss',n:'程遠志',s:'enemy',boss:true,x:6,y:0,hp:100,max:100,atk:24,mv:2,xp:50});else units.push({id:'e3',n:'黄巾弓兵',s:'enemy',x:5,y:2,hp:75,max:75,atk:21,mv:2,xp:30},{id:'e4',n:'黄巾精鋭',s:'enemy',x:6,y:4,hp:90,max:90,atk:24,mv:2,xp:35},{id:'boss2',n:'張宝',s:'enemy',boss:true,x:7,y:1,hp:145,max:145,atk:29,mv:2,xp:70});document.querySelector('#chapter').textContent=s===1?'第一章　義勇軍、起つ':'第二章　黄天の妖術';document.querySelector('#objective').textContent=s===1?'勝利条件：程遠志を含む敵軍を全滅':'勝利条件：張宝を撃破し敵軍を掃討';render()}function terrainDef(u){const t=terrain[u.y][u.x];return t==='forest'?4:t==='hill'?6:t==='village'?3:0}function render(){B.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=document.createElement('div');c.className='cell '+terrain[y][x];const u=at(x,y);if(sel&&phase==='ally'&&!moved&&!u&&dist(sel,{x,y})<=sel.mv)c.classList.add('move');if(sel&&u?.s==='enemy'&&dist(sel,u)===1)c.classList.add('attack');if(u){const d=document.createElement('div');d.className=`unit ${u.s} ${u.boss?'boss':''} ${sel===u?'selected':''}`;d.textContent=u.n.slice(0,2);c.appendChild(d);const h=document.createElement('div');h.className='hp';h.innerHTML=`<i style="width:${Math.max(0,u.hp/u.max*100)}%"></i>`;c.appendChild(h)}c.onclick=()=>tap(x,y);B.appendChild(c)}update()}function tap(x,y){if(phase!=='ally')return;const u=at(x,y);if(u?.s==='ally'){if(u.done){msg(`${u.n}は行動済み`);return}sel=u;moved=false;render();return}if(!sel)return;if(u?.s==='enemy'&&dist(sel,u)===1){hit(sel,u,false);return}if(!moved&&!u&&dist(sel,{x,y})<=sel.mv){sel.x=x;sel.y=y;moved=true;msg(`${sel.n}が${terrain[y][x]==='forest'?'森':terrain[y][x]==='hill'?'丘':'平地'}へ移動`);render()}}function gainXp(a,n){a.xp+=n;msg(`${a.n} 経験値 +${n}`);while(a.xp>=100){a.xp-=100;a.lv++;a.max+=12;a.hp=Math.min(a.max,a.hp+30);a.atk+=3;msg(`LEVEL UP! ${a.n} Lv.${a.lv}`,'levelup')}}function hit(a,d,special){const def=terrainDef(d);const dmg=Math.max(7,Math.floor(a.atk*(special?1.7:1)+Math.random()*9-4-def));d.hp-=dmg;msg(`${a.n}${special?'【'+a.sp+'】':''} → ${d.n} ${dmg}ダメージ${def?'（地形防御-'+def+'）':''}`);if(special){document.body.classList.add('specialFx');setTimeout(()=>document.body.classList.remove('specialFx'),450)}if(d.hp<=0){msg(`${d.boss?'敵将 ':' '}${d.n}を撃破！`,'levelup');gainXp(a,d.xp||20)}a.done=true;sel=null;moved=false;render();check()}function update(){info.innerHTML=sel?`<b>${sel.n}</b> Lv.${sel.lv}<br>HP ${sel.hp}/${sel.max}<br>攻撃 ${sel.atk}<br>EXP ${sel.xp}/100<br>${sel.sp}`:'味方武将を選択';['attack','special','wait'].forEach(id=>document.querySelector('#'+id).disabled=!sel);document.querySelector('#turn').textContent=`${phase==='ally'?'自軍':'敵軍'} TURN ${turn}`}document.querySelector('#attack').onclick=()=>msg('隣接する赤い敵をタップ');document.querySelector('#special').onclick=()=>{if(!sel)return;const e=units.find(u=>u.s==='enemy'&&u.hp>0&&dist(sel,u)===1);e?hit(sel,e,true):msg('必殺技の射程に敵がいません')};document.querySelector('#wait').onclick=()=>{if(sel){sel.done=true;sel=null;moved=false;render()}};document.querySelector('#end').onclick=enemyTurn;async function enemyTurn(){if(phase!=='ally')return;phase='enemy';sel=null;render();for(const e of units.filter(u=>u.s==='enemy'&&u.hp>0)){await new Promise(r=>setTimeout(r,260));const t=units.filter(u=>u.s==='ally'&&u.hp>0).sort((a,b)=>dist(e,a)-dist(e,b))[0];if(!t)break;if(dist(e,t)===1){const dmg=Math.max(5,Math.floor(e.atk+Math.random()*7-8-terrainDef(t)));t.hp-=dmg;msg(`${e.n} → ${t.n} ${dmg}ダメージ`)}else{let dx=Math.sign(t.x-e.x),dy=Math.sign(t.y-e.y),nx=e.x+(Math.abs(t.x-e.x)>=Math.abs(t.y-e.y)?dx:0),ny=e.y+(Math.abs(t.x-e.x)<Math.abs(t.y-e.y)?dy:0);if(nx>=0&&nx<W&&ny>=0&&ny<H&&!at(nx,ny)){e.x=nx;e.y=ny}}render();check()}phase='ally';turn++;units.filter(u=>u.s==='ally').forEach(u=>u.done=false);render();check()}function save(){const heroes={};units.filter(u=>u.s==='ally').forEach(u=>heroes[u.id]={lv:u.lv,xp:u.xp});localStorage.setItem('eiketsuV22',JSON.stringify({stage,heroes}));msg('セーブしました')}function check(){const es=units.some(u=>u.s==='enemy'&&u.hp>0),as=units.some(u=>u.s==='ally'&&u.hp>0);if(!es)result(true);else if(!as)result(false)}function result(win){if(win)save();document.querySelector('#resultTitle').textContent=win?'勝利！':'敗北…';document.querySelector('#resultText').textContent=win?(stage===1?'義勇軍は初陣を飾った。次なる黄巾軍へ進む。':'張宝を破り、義勇軍の名は各地へ響き始めた。'): '義勇軍は力尽きた。地形と必殺技を使って再挑戦しよう。';document.querySelector('#next').style.display=win?'inline-block':'none';document.querySelector('#result').classList.remove('hidden')}document.querySelector('#start').onclick=()=>document.querySelector('#intro').classList.add('hidden');document.querySelector('#load').onclick=()=>{setup(progress.stage||1);document.querySelector('#intro').classList.add('hidden')};document.querySelector('#save').onclick=save;document.querySelector('#reset').onclick=()=>{localStorage.removeItem('eiketsuV22');location.reload()};document.querySelector('#retry').onclick=()=>location.reload();document.querySelector('#next').onclick=()=>{if(stage===1){stage=2;progress.stage=2;document.querySelector('#result').classList.add('hidden');setup(2);msg('第二章開始。張宝を討て！')}else{document.querySelector('#resultText').textContent='第二章クリア！ v23で趙雲加入と第三章へ続く。'}};setup(1);</script></body></html>
