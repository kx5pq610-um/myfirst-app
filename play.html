<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三国志 英傑戦記 PLAY</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#f4e7c3;font-family:system-ui,"Yu Mincho",serif}.top{padding:12px 14px;background:linear-gradient(#291c11,#100c08);border-bottom:1px solid #8b6936;display:flex;justify-content:space-between;gap:10px;align-items:center}.top h1{font-size:20px;margin:0;color:#f0cc72}.wrap{max-width:1000px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(320px,1fr) 280px;gap:12px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:8/7;border:3px solid #5f4526;background:#24331e}.cell{position:relative;display:grid;place-items:center;border:1px solid #0005;min-width:0;user-select:none}.plain{background:#5c7042}.forest{background:#365239}.hill{background:#766342}.village{background:#80643d}.cell.move{box-shadow:inset 0 0 0 4px #66b9ff99}.cell.attack{box-shadow:inset 0 0 0 4px #ff655eaa}.unit{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(13px,3.8vw,23px);border:3px solid #e8cf8b;box-shadow:0 4px 10px #0008}.ally{background:#275b39}.enemy{background:#7a2926}.selected{outline:4px solid #fff0a3}.hp{position:absolute;bottom:2px;left:8%;width:84%;height:5px;background:#260b0b}.hp i{display:block;height:100%;background:#77db6e}.side{display:grid;gap:10px;align-content:start}.panel{background:#17110c;border:1px solid #6c5333;border-radius:10px;padding:11px}.panel h2{font-size:16px;margin:0 0 8px;color:#edcb78}button{border:1px solid #8d6c3b;background:linear-gradient(#3a2919,#21170f);color:#ffe9b0;border-radius:8px;padding:10px;font-weight:800}button:disabled{opacity:.35}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.primary{background:linear-gradient(#7b4d19,#4c2d0d)}#log{height:160px;overflow:auto;font-size:12px;line-height:1.55}.turn{padding:4px 9px;border:1px solid #c29c52;border-radius:999px;color:#ffd978}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:20px;z-index:20}.card{max-width:520px;background:linear-gradient(145deg,#302014,#100c08);border:2px solid #9b773f;border-radius:14px;padding:24px;text-align:center;box-shadow:0 20px 80px #000}.card h2{font-size:32px;color:#f2cf74}.hidden{display:none}.hint{font-size:12px;color:#cdbf9f}.special{animation:flash .5s}@keyframes flash{50%{filter:brightness(2)}}@media(max-width:720px){.wrap{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.panel:last-child{grid-column:1/-1}.top h1{font-size:17px}.board{width:100%}}@media(max-width:460px){.wrap{padding:6px;gap:6px}.side{grid-template-columns:1fr}.panel:last-child{grid-column:auto}.unit{border-width:2px}}</style></head><body><div class="top"><div><h1>三国志 英傑戦記</h1><small>第一章　義勇軍、起つ</small></div><div id="turn" class="turn">自軍 TURN 1</div></div><main class="wrap"><div id="board" class="board"></div><aside class="side"><section class="panel"><h2>武将</h2><div id="info">味方武将を選択</div><div class="hint">味方をタップ → 青マスへ移動 → 赤マスの敵を攻撃</div></section><section class="panel"><h2>行動</h2><div class="actions"><button id="attack" disabled>攻撃</button><button id="special" disabled>必殺技</button><button id="wait" disabled>待機</button><button id="end" class="primary">ターン終了</button></div></section><section class="panel"><h2>戦況</h2><div id="log"></div></section></aside></main><div id="intro" class="modal"><div class="card"><div>184年　幽州</div><h2>黄巾の乱</h2><p>乱世の中、劉備・関羽・張飛は民を守るため義勇軍を起こした。</p><p>敵将をすべて撃破せよ。</p><button id="start" class="primary">出陣する</button></div></div><div id="result" class="modal hidden"><div class="card"><h2 id="resultTitle">勝利！</h2><p id="resultText"></p><button onclick="location.reload()" class="primary">もう一度遊ぶ</button><p><a href="index.html" style="color:#f1cc71">本編へ</a></p></div></div><script>const W=8,H=7,terrain=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>(x===3&&y>1?'forest':(x===6&&y<3?'hill':(x===1&&y===1?'village':'plain')))));let units=[{id:'liu',n:'劉備',s:'ally',x:1,y:5,hp:110,max:110,atk:28,mv:3,sp:'仁徳の号令'},{id:'guan',n:'関羽',s:'ally',x:2,y:5,hp:120,max:120,atk:36,mv:3,sp:'青龍偃月斬'},{id:'zhang',n:'張飛',s:'ally',x:0,y:6,hp:125,max:125,atk:35,mv:3,sp:'蛇矛猛撃'},{id:'e1',n:'黄巾兵',s:'enemy',x:5,y:1,hp:65,max:65,atk:18,mv:2},{id:'e2',n:'黄巾兵',s:'enemy',x:6,y:2,hp:65,max:65,atk:18,mv:2},{id:'boss',n:'程遠志',s:'enemy',x:6,y:0,hp:100,max:100,atk:24,mv:2}];let sel=null,moved=false,turn=1,phase='ally';const B=document.querySelector('#board'),info=document.querySelector('#info'),log=document.querySelector('#log');function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function at(x,y){return units.find(u=>u.hp>0&&u.x===x&&u.y===y)}function msg(t){log.innerHTML=`<div>› ${t}</div>`+log.innerHTML}function render(){B.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=document.createElement('div');c.className='cell '+terrain[y][x];c.dataset.x=x;c.dataset.y=y;const u=at(x,y);if(sel&&phase==='ally'&&!moved&&!u&&dist(sel,{x,y})<=sel.mv)c.classList.add('move');if(sel&&u&&u.s==='enemy'&&dist(sel,u)===1)c.classList.add('attack');if(u){const d=document.createElement('div');d.className=`unit ${u.s} ${sel===u?'selected':''}`;d.textContent=u.n.slice(0,2);c.appendChild(d);const h=document.createElement('div');h.className='hp';h.innerHTML=`<i style="width:${Math.max(0,u.hp/u.max*100)}%"></i>`;c.appendChild(h)}c.onclick=()=>tap(x,y);B.appendChild(c)}update()}function tap(x,y){if(phase!=='ally')return;const u=at(x,y);if(u?.s==='ally'){sel=u;moved=false;render();return}if(!sel)return;if(u?.s==='enemy'&&dist(sel,u)===1){hit(sel,u,false);return}if(!moved&&!u&&dist(sel,{x,y})<=sel.mv){sel.x=x;sel.y=y;moved=true;msg(`${sel.n}が移動`);render()}}function hit(a,d,special){const dmg=Math.max(8,Math.floor(a.atk*(special?1.75:1)+(Math.random()*9-4)));d.hp-=dmg;msg(`${a.n}${special?'【'+a.sp+'】':''} → ${d.n}に${dmg}ダメージ`);if(d.hp<=0)msg(`${d.n}を撃破！`);a.done=true;sel=null;moved=false;document.body.classList.add('special');setTimeout(()=>document.body.classList.remove('special'),300);render();check()}function update(){if(sel)info.innerHTML=`<b>${sel.n}</b><br>HP ${sel.hp}/${sel.max}<br>攻撃 ${sel.atk}<br>${sel.sp||''}`;else info.textContent='味方武将を選択';document.querySelector('#attack').disabled=!sel;document.querySelector('#special').disabled=!sel;document.querySelector('#wait').disabled=!sel;document.querySelector('#turn').textContent=`${phase==='ally'?'自軍':'敵軍'} TURN ${turn}`}document.querySelector('#attack').onclick=()=>msg('隣接する赤い敵マスをタップしてください');document.querySelector('#special').onclick=()=>{if(!sel)return;const e=units.filter(u=>u.s==='enemy'&&u.hp>0&&dist(sel,u)===1)[0];if(e)hit(sel,e,true);else msg('必殺技の射程に敵がいません')};document.querySelector('#wait').onclick=()=>{if(sel){sel.done=true;sel=null;moved=false;render()}};document.querySelector('#end').onclick=enemyTurn;async function enemyTurn(){if(phase!=='ally')return;phase='enemy';sel=null;render();for(const e of units.filter(u=>u.s==='enemy'&&u.hp>0)){await new Promise(r=>setTimeout(r,350));const targets=units.filter(u=>u.s==='ally'&&u.hp>0).sort((a,b)=>dist(e,a)-dist(e,b));const t=targets[0];if(!t)break;if(dist(e,t)===1){hitEnemy(e,t)}else{const dx=Math.sign(t.x-e.x),dy=Math.sign(t.y-e.y);let nx=e.x+(Math.abs(t.x-e.x)>=Math.abs(t.y-e.y)?dx:0),ny=e.y+(Math.abs(t.x-e.x)<Math.abs(t.y-e.y)?dy:0);if(!at(nx,ny)&&nx>=0&&nx<W&&ny>=0&&ny<H){e.x=nx;e.y=ny}render()}}phase='ally';turn++;units.filter(u=>u.s==='ally').forEach(u=>u.done=false);render();check()}function hitEnemy(a,d){const dmg=Math.max(6,Math.floor(a.atk+Math.random()*7-8));d.hp-=dmg;msg(`${a.n} → ${d.n}に${dmg}ダメージ`);render()}function check(){const enemies=units.some(u=>u.s==='enemy'&&u.hp>0),allies=units.some(u=>u.s==='ally'&&u.hp>0);if(!enemies)showResult(true);if(!allies)showResult(false)}function showResult(win){document.querySelector('#resultTitle').textContent=win?'勝利！':'敗北…';document.querySelector('#resultText').textContent=win?'義勇軍は黄巾軍を退けた。第一章クリア！':'義勇軍は力尽きた。陣形を変えて再挑戦しよう。';document.querySelector('#result').classList.remove('hidden')}document.querySelector('#start').onclick=()=>{document.querySelector('#intro').classList.add('hidden');msg('第一章開始。黄巾軍を撃破せよ！')};render();</script></body></html>
