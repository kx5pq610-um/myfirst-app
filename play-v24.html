<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>三国志 英傑戦記 v24</title><style>*{box-sizing:border-box}body{margin:0;background:#090806;color:#f3e5bd;font-family:system-ui,serif}.top{padding:10px;background:#181008;border-bottom:1px solid #886532;display:flex;justify-content:space-between}.top b{color:#efc96c}.wrap{max-width:900px;margin:auto;padding:8px;display:grid;grid-template-columns:1fr 260px;gap:8px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:8/7;border:3px solid #72552d}.c{position:relative;display:grid;place-items:center;border:1px solid #0005;background:#5b7042}.c:nth-child(5n){background:#39533a}.u{width:76%;height:76%;border-radius:50%;display:grid;place-items:center;font-weight:900;border:2px solid #e7ce89;font-size:clamp(11px,3vw,20px)}.a{background:#285c3b}.e{background:#762a27}.boss{box-shadow:0 0 14px #ff9b36}.sel{outline:4px solid #fff19b}.move{box-shadow:inset 0 0 0 4px #65baff99}.atk{box-shadow:inset 0 0 0 4px #ff5e55aa}.hp{position:absolute;bottom:2px;width:80%;height:5px;background:#2a0808}.hp i{display:block;height:100%;background:#70dc6d}.panel{background:#17110c;border:1px solid #6d5231;border-radius:9px;padding:10px;margin-bottom:8px}button{padding:10px;border-radius:7px;border:1px solid #8d6c3b;background:#352517;color:#ffe8ad;font-weight:800}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.gold{background:#714416}.log{height:170px;overflow:auto;font-size:12px}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:20px;z-index:5}.card{max-width:520px;background:#1c130c;border:2px solid #95703b;border-radius:14px;padding:22px;text-align:center}.card h1,.card h2{color:#efca70}.hide{display:none}.loot{color:#ffd965;font-weight:900}@media(max-width:650px){.wrap{grid-template-columns:1fr}.log{height:110px}}</style></head><body><header class="top"><b>三国志 英傑戦記 v24</b><span id="turn">自軍 TURN 1</span></header><main class="wrap"><div id="board" class="board"></div><aside><div class="panel"><b id="chapter"></b><p id="objective"></p><div id="info">武将を選択してください</div></div><div class="panel buttons"><button id="special">必殺技</button><button id="wait">待機</button><button id="end" class="gold">ターン終了</button><button id="save">セーブ</button></div><div id="log" class="panel log"></div></aside></main><div id="modal" class="modal"><div class="card"><h1>三国志 英傑戦記</h1><p>劉備・関羽・張飛、そして趙雲。乱世を駆ける英傑たちの戦い。</p><button id="new" class="gold">新しく始める</button><button id="load">つづきから</button></div></div><div id="result" class="modal hide"><div class="card"><h2 id="rt">勝利！</h2><p id="rr"></p><button id="next" class="gold">次の章へ</button></div></div><script>const W=8,H=7,K='eiketsuPlayable24';let data=JSON.parse(localStorage.getItem(K)||'{"stage":1,"heroes":{},"loot":[]}'),stage=1,turn=1,phase='a',sel=null,moved=false,units=[];const chapters={1:['第一章 義勇軍、起つ','程遠志を撃破せよ'],2:['第二章 黄天の妖術','張宝を撃破せよ'],3:['第三章 常山の龍','裴元紹を撃破せよ']};const heroes=[['liu','劉備',110,28,3,'仁徳の号令'],['guan','関羽',120,36,3,'青龍偃月斬'],['zhang','張飛',125,35,3,'蛇矛猛撃'],['zhao','趙雲',118,34,4,'龍胆突撃']];const equip={liu:['雌雄一対の剣',12],guan:['青龍偃月刀',18],zhang:['丈八蛇矛',17],zhao:['龍胆亮銀槍',15]};const B=document.querySelector('#board'),L=document.querySelector('#log');function d(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}function at(x,y){return units.find(u=>u.hp>0&&u.x==x&&u.y==y)}function say(s,c=''){L.innerHTML='<div class="'+c+'">› '+s+'</div>'+L.innerHTML}function makeHero(h,i){let p=data.heroes[h[0]]||{lv:1,xp:0};let bonus=data.loot.includes(h[0])?equip[h[0]][1]:0;return{id:h[0],n:h[1],s:'a',hp:h[2]+(p.lv-1)*12,max:h[2]+(p.lv-1)*12,atk:h[3]+(p.lv-1)*3+bonus,mv:h[4],sp:h[5],lv:p.lv,xp:p.xp,x:i,y:6}}function setup(s){stage=s;turn=1;phase='a';sel=null;moved=false;L.innerHTML='';let hs=heroes.slice(0,s<3?3:4).map(makeHero);if(s===3)hs[3].x=3;units=hs;let es=s===1?[['兵A',5,2,65,18],['兵B',6,3,65,18],['程遠志',7,1,110,25,1]]:s===2?[['弓兵',5,2,80,22],['精鋭',6,4,95,25],['張宝',7,1,150,29,1]]:[['騎兵',5,2,100,27],['精鋭',6,4,105,28],['裴元紹',7,1,175,32,1]];es.forEach((q,i)=>units.push({id:'e'+i,n:q[0],s:'e',x:q[1],y:q[2],hp:q[3],max:q[3],atk:q[4],mv:2,boss:q[5],xp:q[5]?65:30}));document.querySelector('#chapter').textContent=chapters[s][0];document.querySelector('#objective').textContent='勝利条件：'+chapters[s][1];if(s===3)say('趙雲が仲間になった！ 必殺技「龍胆突撃」が使用可能。','loot');render()}function render(){B.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=document.createElement('div');c.className='c';let u=at(x,y);if(sel&&!moved&&!u&&d(sel,{x,y})<=sel.mv)c.classList.add('move');if(sel&&u?.s==='e'&&d(sel,u)===1)c.classList.add('atk');if(u){let z=document.createElement('div');z.className='u '+u.s+(u.boss?' boss':'')+(sel===u?' sel':'');z.textContent=u.n.slice(0,2);c.append(z);let hp=document.createElement('div');hp.className='hp';hp.innerHTML='<i style="width:'+Math.max(0,u.hp/u.max*100)+'%"></i>';c.append(hp)}c.onclick=()=>tap(x,y);B.append(c)}document.querySelector('#turn').textContent=(phase==='a'?'自軍':'敵軍')+' TURN '+turn;document.querySelector('#info').innerHTML=sel?'<b>'+sel.n+'</b> Lv.'+sel.lv+'<br>HP '+sel.hp+'/'+sel.max+'<br>攻撃 '+sel.atk+'<br>EXP '+sel.xp+'/100<br>'+sel.sp+(data.loot.includes(sel.id)?'<br>装備 '+equip[sel.id][0]:''):'武将を選択してください'}function tap(x,y){if(phase!=='a')return;let u=at(x,y);if(u?.s==='a'&&!u.done){sel=u;moved=false;render();return}if(!sel)return;if(u?.s==='e'&&d(sel,u)===1){hit(sel,u,1);return}if(!u&&!moved&&d(sel,{x,y})<=sel.mv){sel.x=x;sel.y=y;moved=true;render()}}function hit(a,b,m){let dmg=Math.max(8,Math.floor(a.atk*m+Math.random()*9-4));b.hp-=dmg;say(a.n+(m>1?'【'+a.sp+'】':'')+' → '+b.n+' '+dmg+'ダメージ');if(b.hp<=0){say(b.n+'を撃破！','loot');a.xp+=b.xp||25;while(a.xp>=100){a.xp-=100;a.lv++;a.atk+=3;a.max+=12;a.hp+=12;say(a.n+' LEVEL UP! Lv.'+a.lv,'loot')}}a.done=true;sel=null;moved=false;render();check()}document.querySelector('#special').onclick=()=>{if(!sel)return;let e=units.find(u=>u.s==='e'&&u.hp>0&&d(sel,u)===1);e?hit(sel,e,1.7):say('隣接する敵がいません')};document.querySelector('#wait').onclick=()=>{if(sel){sel.done=true;sel=null;render()}};document.querySelector('#end').onclick=async()=>{phase='e';render();for(let e of units.filter(u=>u.s==='e'&&u.hp>0)){await new Promise(r=>setTimeout(r,220));let a=units.filter(u=>u.s==='a'&&u.hp>0).sort((x,y)=>d(e,x)-d(e,y))[0];if(!a)break;if(d(e,a)===1){let dmg=Math.max(6,Math.floor(e.atk+Math.random()*7-6));a.hp-=dmg;say(e.n+' → '+a.n+' '+dmg+'ダメージ')}else{let nx=e.x+Math.sign(a.x-e.x),ny=e.y;if(at(nx,ny)||nx<0||nx>=W){nx=e.x;ny=e.y+Math.sign(a.y-e.y)}if(nx>=0&&nx<W&&ny>=0&&ny<H&&!at(nx,ny)){e.x=nx;e.y=ny}}render();check()}phase='a';turn++;units.filter(u=>u.s==='a').forEach(u=>u.done=false);render()};function persist(nextStage=stage){let h={};units.filter(u=>u.s==='a').forEach(u=>h[u.id]={lv:u.lv,xp:u.xp});data.heroes={...data.heroes,...h};data.stage=nextStage;localStorage.setItem(K,JSON.stringify(data))}document.querySelector('#save').onclick=()=>{persist();say('セーブしました')};function check(){if(!units.some(u=>u.s==='e'&&u.hp>0))finish(true);else if(!units.some(u=>u.s==='a'&&u.hp>0))finish(false)}function finish(win){let r='';if(win){if(stage===1&&!data.loot.includes('liu')){data.loot.push('liu');r='雌雄一対の剣を獲得！'}if(stage===2){['guan','zhang'].forEach(x=>{if(!data.loot.includes(x))data.loot.push(x)});r='青龍偃月刀・丈八蛇矛を獲得！'}if(stage===3&&!data.loot.includes('zhao')){data.loot.push('zhao');r='趙雲専用「龍胆亮銀槍」を獲得！'}persist(Math.min(3,stage+1))}document.querySelector('#rt').textContent=win?'勝利！':'敗北…';document.querySelector('#rr').textContent=win?r:'義勇軍は敗れた。再挑戦しよう。';document.querySelector('#next').textContent=win?(stage<3?'次の章へ':'キャンペーンクリア！'):'再挑戦';document.querySelector('#result').classList.remove('hide')}document.querySelector('#next').onclick=()=>{document.querySelector('#result').classList.add('hide');if(!units.some(u=>u.s==='a'&&u.hp>0))setup(stage);else if(stage<3)setup(stage+1);else{document.querySelector('#modal').classList.remove('hide');document.querySelector('#modal .card').innerHTML='<h1>三章クリア！</h1><p>劉備・関羽・張飛・趙雲が揃い、四つの専用武器を獲得しました。</p><button onclick="location.reload()">タイトルへ</button>'}};document.querySelector('#new').onclick=()=>{data={stage:1,heroes:{},loot:[]};localStorage.setItem(K,JSON.stringify(data));setup(1);document.querySelector('#modal').classList.add('hide')};document.querySelector('#load').onclick=()=>{setup(data.stage||1);document.querySelector('#modal').classList.add('hide')};setup(1);</script></body></html>
