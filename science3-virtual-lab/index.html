<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(180deg,#06101c,#091727 55%,#07111f);color:var(--text);min-height:100vh}button,input,select{font:inherit}.hero{min-height:66vh;display:grid;place-items:center;padding:56px 24px;background:radial-gradient(circle at 70% 20%,rgba(98,230,199,.17),transparent 28%),radial-gradient(circle at 25% 10%,rgba(114,167,255,.16),transparent 25%)}.hero-inner{width:min(1100px,100%)}.eyebrow,.kicker{font-size:.78rem;font-weight:800;letter-spacing:.16em;color:var(--accent)}h1{font-size:clamp(3rem,8vw,6.8rem);line-height:.9;margin:.18em 0 .3em;letter-spacing:-.055em}h1 span{color:transparent;-webkit-text-stroke:1.5px rgba(238,247,255,.75)}.hero p{font-size:clamp(1rem,2vw,1.28rem);line-height:1.9;color:var(--muted);max-width:760px}.primary,.ghost{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:13px 20px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#05231d;margin-top:18px}.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}main{width:min(1180px,calc(100% - 32px));margin:auto}.section{padding:62px 0}.intro{display:grid;grid-template-columns:1fr 1fr;gap:40px;border-bottom:1px solid var(--line)}h2{font-size:clamp(2rem,4vw,3.5rem);margin:.15em 0 .25em;letter-spacing:-.035em}.intro>p,.lab-desc{color:var(--muted);line-height:1.9}.lab-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}.lab-card{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:24px;padding:22px;min-height:230px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;justify-content:space-between}.lab-card:hover{transform:translateY(-4px);border-color:rgba(98,230,199,.5);box-shadow:var(--shadow)}.lab-card .num{font-size:.75rem;color:var(--muted);font-weight:800}.lab-card .icon{font-size:2.2rem}.lab-card h3{margin:12px 0 7px;font-size:1.25rem}.lab-card p{margin:0;color:var(--muted);line-height:1.6;font-size:.92rem}.lab-card .tag{margin-top:16px;font-size:.74rem;color:var(--accent);font-weight:800}.lab-area{padding:40px 0 90px}.hidden{display:none}.lab-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:22px}.status-badge{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:9px 14px;font-size:.84rem;color:var(--muted)}.status-badge.running{color:#071a17;background:var(--accent);border-color:transparent;font-weight:800}.sim-shell{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.stage,.controls{background:linear-gradient(180deg,#0b1b2c,#081522);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}.stage{min-height:620px;position:relative;overflow:hidden;touch-action:none}.controls{padding:20px;align-self:start;position:sticky;top:18px}.control-group{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.control-group:last-child{border:0;margin:0;padding:0}.control-label{display:flex;justify-content:space-between;gap:12px;font-size:.86rem;font-weight:800;margin-bottom:10px}.control-label span:last-child{color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#091827;color:var(--text)}.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:12px 10px;font-weight:850;cursor:pointer;background:var(--accent);color:#06231d}.btn.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#ff98a6;color:#351016}.btn.full{width:100%}.readout{display:grid;grid-template-columns:1fr 1fr;gap:9px}.meter{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.meter b{display:block;font-size:1.14rem;margin-top:3px}.meter span{color:var(--muted);font-size:.74rem}.canvas{width:100%;height:100%;display:block;min-height:620px}.note{font-size:.79rem;line-height:1.65;color:var(--muted)}.hint{position:absolute;left:18px;bottom:18px;background:rgba(5,14,24,.72);border:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 13px;border-radius:12px;color:#dcecff;font-size:.8rem;pointer-events:none;max-width:72%}.danger-note{color:#ffbac4}.switchline{display:flex;gap:8px}.switchline .btn{flex:1}.mini-label{font-size:.72rem;color:var(--muted);margin:8px 0 4px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}footer{border-top:1px solid var(--line);padding:30px max(24px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:.82rem}footer strong{color:var(--text)}
@media(max-width:980px){.lab-grid{grid-template-columns:repeat(2,1fr)}.sim-shell{grid-template-columns:1fr}.controls{position:static}.stage,.canvas{min-height:560px}}

<body>
<header class="hero"><div class="hero-inner"><div class="eyebrow">SCIENCE 3 · VIRTUAL LAB</div><h1>中学3年理科<br><span>バーチャル実験室</span></h1><p>ボタンで答えを見るのではなく、器具を操作すると現象が起こる。<br>欠席時でも「実験をした感覚」に近づけるためのシミュレーションです。</p><a class="primary" href="#labs">実験を選ぶ</a></div></header>
<main>
<section class="section intro"><div><p class="kicker">HOW TO USE</p><h2>触って、変化を見る</h2></div><p>インストール不要。Chromebook・PC・タブレットで動きます。条件設定は必要最小限にし、実験器具を動かす操作と、結果の変化を中心にしています。</p></section>
<section id="labs" class="section"><p class="kicker">VIRTUAL LABS</p><h2>実験一覧</h2><div id="labGrid" class="lab-grid"></div></section>
<section id="labArea" class="lab-area hidden" aria-live="polite"><div class="lab-head"><div><button id="backBtn" class="ghost">← 実験一覧へ</button><p id="labUnit" class="kicker"></p><h2 id="labTitle"></h2><p id="labDesc" class="lab-desc"></p></div><div id="statusBadge" class="status-badge">準備中</div></div><div class="sim-shell"><div id="stage" class="stage"></div><aside id="controls" class="controls"></aside></div></section>
</main>
<footer><strong>中学3年理科 バーチャル実験室</strong><span>実物実験を行えないときの代替操作環境</span></footer>
<script>
const labs=[
{
id:'motion',icon:'🛒',unit:'運動とエネルギー',title:'斜面を下る台車',desc:'台車をスタート位置に置き、斜面角度と記録タイマーを設定して手を離します。'}
,
{
id:'work',icon:'⚙️',unit:'運動とエネルギー',title:'仕事と滑車',desc:'ひもの端を実際にドラッグして、おもりを持ち上げます。定滑車と動滑車の違いを体感できます。'}
,
{
id:'conductivity',icon:'💡',unit:'化学変化とイオン',title:'水溶液と電流',desc:'電極を水溶液へ下ろしてスイッチを入れ、豆電球と電流計の変化を観察します。'}
,
{
id:'electrolysis',icon:'⚡',unit:'化学変化とイオン',title:'塩化銅水溶液の電気分解',desc:'電極を浸して通電し、陰極への銅の付着、陽極の気体、水溶液の色の変化を再現します。'}
,
{
id:'neutralization',icon:'🧪',unit:'化学変化とイオン',title:'酸とアルカリの中和',desc:'ビュレットのコックを開き、塩酸を少しずつ滴下します。指示薬の色とpHが連続的に変化します。'}
,
{
id:'daniel',icon:'🔋',unit:'化学変化とイオン',title:'ダニエル電池',desc:'塩橋と回路を接続してスイッチを入れ、電子・イオン・電極の変化を観察します。'}
,
{
id:'cell',icon:'🔬',unit:'生命の連続性',title:'根の先端と細胞分裂',desc:'顕微鏡の倍率、ステージ位置、粗動・微動ねじを操作して分裂中の細胞を探します。'}
,
{
id:'sky',icon:'🌞',unit:'地球と宇宙',title:'透明半球と太陽の動き',desc:'時刻を動かし、透明半球上に太陽の位置を記録して1日の道筋を再現します。'}
];

const grid=document.querySelector('#labGrid'),area=document.querySelector('#labArea'),stage=document.querySelector('#stage'),controls=document.querySelector('#controls');

const titleEl=document.querySelector('#labTitle'),unitEl=document.querySelector('#labUnit'),descEl=document.querySelector('#labDesc'),badge=document.querySelector('#statusBadge');
let cleanup=()=>{
}
;

labs.forEach((l,i)=>{
const c=document.createElement('article');
c.className='lab-card';
c.innerHTML=`<div><div class="num">LAB ${String(i+1).padStart(2,'0')}</div><div class="icon">${l.icon}</div><h3>${l.title}</h3><p>${l.desc}</p></div><div class="tag">${l.unit}</div>`;
c.onclick=()=>openLab(l);
grid.appendChild(c)}
);

document.querySelector('#backBtn').onclick=()=>{
cleanup();
area.classList.add('hidden');
document.querySelector('#labs').scrollIntoView({
behavior:'smooth'}
);
history.replaceState(null,'',location.pathname)}
;

function setRunning(v,text){
badge.textContent=text||(v?'実験中':'停止中');
badge.classList.toggle('running',v)}

function openLab(l){
cleanup();
titleEl.textContent=l.title;
unitEl.textContent=l.unit;
descEl.textContent=l.desc;
area.classList.remove('hidden');
setRunning(false,'準備完了');
stage.innerHTML='';
controls.innerHTML='';
cleanup=renderers[l.id]();
history.replaceState(null,'',`#${l.id}`);
area.scrollIntoView({
behavior:'smooth'}
)}

function group(label,html){
return `<div class="control-group"><div class="control-label">${label}</div>${html}</div>`}

function slider(id,label,min,max,step,val,unit=''){
return group(`<span>${label}</span><span id="${id}Val">${val}${unit}</span>`,`<input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}">`)}

function buttons(startText='開始'){
return group('',`<div class="btn-row"><button id="start" class="btn">${startText}</button><button id="reset" class="btn secondary">リセット</button></div>`)}

function canvasSetup(hint=''){
stage.innerHTML=`<canvas class="canvas"></canvas>${hint?`<div class="hint">${
hint}
</div>`:''}`;
const c=stage.querySelector('canvas'),ctx=c.getContext('2d');
const resize=()=>{
const r=c.getBoundingClientRect();
c.width=r.width*devicePixelRatio;
c.height=r.height*devicePixelRatio;
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
;
resize();
window.addEventListener('resize',resize);
return {
c,ctx,resize,off:()=>window.removeEventListener('resize',resize)}
}

function rr(ctx,x,y,w,h,r=12){
ctx.beginPath();
ctx.roundRect(x,y,w,h,r)}
function text(ctx,t,x,y,size=16,color='#eef7ff',align='left'){
ctx.fillStyle=color;
ctx.font=`700 ${size}px system-ui`;
ctx.textAlign=align;
ctx.fillText(t,x,y)}
function line(ctx,x1,y1,x2,y2,color='rgba(255,255,255,.5)',w=2){
ctx.strokeStyle=color;
ctx.lineWidth=w;
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke()}
function clamp(v,a,b){
return Math.max(a,Math.min(b,v))}

function panelBox(ctx,x,y,w,h,label){
 ctx.save();
 ctx.fillStyle='#d8dde2';ctx.strokeStyle='#66737e';ctx.lineWidth=2;rr(ctx,x,y,w,h,8);ctx.fill();ctx.stroke();
 if(label){ctx.fillStyle='#24313c';ctx.font='700 12px system-ui';ctx.textAlign='left';ctx.fillText(label,x+10,y+17)}
 ctx.restore();
}
function drawPowerSupply(ctx,x,y,w,h,voltage,on){
 panelBox(ctx,x,y,w,h,'直流電源装置');
 ctx.fillStyle='#1b252e';rr(ctx,x+12,y+26,w-24,h-42,5);ctx.fill();
 ctx.fillStyle=on?'#78f0ce':'#52606a';ctx.font='800 20px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText((on?Number(voltage).toFixed(1):'0.0')+' V',x+w*.5,y+54);
 [['−','#3a78d4',.27],['＋','#d95061',.73]].forEach(([lab,col,f])=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+w*f,y+h-15,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17212a';ctx.font='800 13px system-ui';ctx.fillText(lab,x+w*f,y+h-11)});
}
function drawAnalogMeter(ctx,x,y,w,h,value,max,label='A'){
 panelBox(ctx,x,y,w,h,'電流計');
 const cx=x+w/2,cy=y+h*.72,R=Math.min(w*.36,h*.42);
 ctx.strokeStyle='#303b44';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,Math.PI,Math.PI*2);ctx.stroke();
 for(let i=0;i<=10;i++){const a=Math.PI+i/10*Math.PI;const r1=R-7,r2=R;line(ctx,cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,cx+Math.cos(a)*r2,cy+Math.sin(a)*r2,'#303b44',1)}
 const f=clamp(value/max,0,1),a=Math.PI+f*Math.PI;line(ctx,cx,cy,cx+Math.cos(a)*(R-11),cy+Math.sin(a)*(R-11),'#d94a4a',2.5);
 ctx.fillStyle='#25313a';ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#24313c';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText(label,cx,y+h-8);
}
function drawWire(ctx,pts,color='#cf3e4f',width=4){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.lineCap='butt';ctx.lineJoin='miter'}
function pointerXY(c,e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}


const renderers={

motion(){
let run=false,t=0,last=performance.now(),raf,nextDot=0,dots=[];
controls.innerHTML=slider('angle','斜面の角度',5,30,1,15,'°')+slider('timerHz','記録タイマー',20,60,10,50,' Hz')+buttons('手を離す')+`<div class="readout"><div class="meter"><span>瞬間の速さ</span><b id="speedR">0.00 m/s</b></div><div class="meter"><span>経過時間</span><b id="timeR">0.00 s</b></div></div><div class="control-group"><div class="note">斜面は長さ1.20 m・摩擦なしのモデルです。点の間隔が広がるほど、台車の速さが大きくなっています。</div></div>`;
const {
c,ctx,off}
=canvasSetup('「手を離す」で台車を解放。記録テープはタイマーを通って引き出されます。');

function params(){
const a=+angle.value*Math.PI/180;
return {
a,acc:9.8*Math.sin(a)}
}
function resetMotion(){
run=false;
t=0;
nextDot=0;
dots=[];
start.textContent='手を離す';
setRunning(false,'台車は静止');
draw()}
function draw(){
const w=c.clientWidth,h=c.clientHeight,{
a,acc}
=params();
ctx.clearRect(0,0,w,h);
const sx=w*.16,sy=h*.72,len=Math.min(w*.68,620),ex=sx+len*Math.cos(a),ey=sy-len*Math.sin(a);
line(ctx,sx,sy,ex,ey,'#9aafbd',11);
line(ctx,sx-25,sy+7,w*.91,sy+7,'rgba(255,255,255,.12)',3);
const dist=Math.min(.5*acc*t*t,1.20),travel=dist/1.20*(len-50),px=sx+travel*Math.cos(a),py=sy-travel*Math.sin(a);
ctx.save();
ctx.translate(px,py-18);
ctx.rotate(-a);
ctx.fillStyle='#62e6c7';
rr(ctx,-28,-14,56,24,7);
ctx.fill();
ctx.fillStyle='#07111f';
ctx.beginPath();
ctx.arc(-17,13,8,0,Math.PI*2);
ctx.arc(17,13,8,0,Math.PI*2);
ctx.fill();
ctx.restore();
ctx.fillStyle='#e9edf2';
ctx.fillRect(w*.06,h*.15,w*.78,32);
dots.forEach(d=>{
ctx.fillStyle='#263442';
ctx.beginPath();
ctx.arc(w*.075+d.x,h*.165,2.4,0,Math.PI*2);
ctx.fill()}
);
text(ctx,'記録テープ',w*.06,h*.13,14,'#9fb4c9');
text(ctx,`${angle.value}°`,sx+65,sy-18,18,'#62e6c7');
speedR.textContent=`${(acc*t).toFixed(2)} m/s`;
timeR.textContent=`${t.toFixed(2)} s`;
if(dist>=1.20&&run){
run=false;
start.textContent='もう一度';
setRunning(false,'斜面の下に到着')}
}

function loop(now){
const dt=Math.min((now-last)/1000,.03);
last=now;
if(run){
t+=dt;
const hz=+timerHz.value;
while(t>=nextDot){
const {
acc}
=params(),dist=.5*acc*nextDot*nextDot;
if(dist<1.20)dots.push({
x:dist/1.20*c.clientWidth*.70}
);
nextDot+=1/hz}
}
draw();
raf=requestAnimationFrame(loop)}
angle.oninput=()=>{
angleVal.textContent=angle.value+'°';
resetMotion()}
;
timerHz.oninput=()=>{
timerHzVal.textContent=timerHz.value+' Hz';
resetMotion()}
;
start.onclick=()=>{
if(t>0&&!run)resetMotion();
run=true;
last=performance.now();
setRunning(true,'台車が運動中');
start.textContent='運動中'}
;
document.querySelector('#reset').onclick=resetMotion;
raf=requestAnimationFrame(loop);
return()=>{
cancelAnimationFrame(raf);
off()}
}
,

work(){
let pulled=0,drag=false,raf;
controls.innerHTML=group('<span>滑車</span>',`<select id="pulley"><option value="fixed">定滑車</option><option value="movable">動滑車</option></select>`)+slider('mass','おもりの質量',100,500,50,200,' g')+`<div class="readout"><div class="meter"><span>必要な力</span><b id="forceR">2.0 N</b></div><div class="meter"><span>ひもを引いた距離</span><b id="distR">0 cm</b></div></div><div class="control-group"><button id="reset" class="btn secondary full">元に戻す</button><div class="note" style="margin-top:10px">画面の黄色い取っ手を下方向へドラッグしてください。</div></div>`;
const {
c,ctx,off}
=canvasSetup('黄色い取っ手を下へドラッグ。力と距離の違いを手の操作で比べます。');

function ratio(){
return pulley.value==='fixed'?1:2}
function maxPull(){
return pulley.value==='fixed'?170:300}
function draw(){
const w=c.clientWidth,h=c.clientHeight,movable=pulley.value==='movable',r=ratio(),lift=pulled/r;
ctx.clearRect(0,0,w,h);
line(ctx,w*.17,h*.17,w*.83,h*.17,'#9aafbd',9);
if(movable){
const cx=w*.46,py=h*.54-lift*.68;
ctx.strokeStyle='#d9e3ea';
ctx.lineWidth=4;
ctx.beginPath();
ctx.moveTo(w*.32,h*.17);
ctx.lineTo(w*.32,py);
ctx.arc(cx,py,55,Math.PI,0,false);
ctx.lineTo(w*.70,h*.17+pulled*.75);
ctx.stroke();
ctx.strokeStyle='#7890a3';
ctx.lineWidth=10;
ctx.beginPath();
ctx.arc(cx,py,55,0,Math.PI*2);
ctx.stroke();
ctx.fillStyle='#62e6c7';
rr(ctx,cx-48,py+68,96,64,10);
ctx.fill();
text(ctx,`${mass.value} g`,cx,py+106,16,'#06231d','center');
drawHandle(w*.70,h*.17+pulled*.75)}
else{
const pcx=w*.52,pcy=h*.28;
ctx.strokeStyle='#d9e3ea';
ctx.lineWidth=4;
ctx.beginPath();
ctx.moveTo(w*.31,h*.66-lift*.68);
ctx.lineTo(w*.47,pcy);
ctx.arc(pcx,pcy,50,Math.PI,0,false);
ctx.lineTo(w*.72,h*.38+pulled*.75);
ctx.stroke();
ctx.strokeStyle='#7890a3';
ctx.lineWidth=10;
ctx.beginPath();
ctx.arc(pcx,pcy,50,0,Math.PI*2);
ctx.stroke();
ctx.fillStyle='#62e6c7';
rr(ctx,w*.31-48,h*.66-lift*.68-32,96,64,10);
ctx.fill();
text(ctx,`${mass.value} g`,w*.31,h*.66-lift*.68+6,16,'#06231d','center');
drawHandle(w*.72,h*.38+pulled*.75)}

 const sx=w*.68,sy=h*.17;ctx.fillStyle='#d7e7f6';ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);ctx.arc(sx+54,sy,6,0,Math.PI*2);ctx.fill();line(ctx,sx,sy,sx+(sw?54:43),sy+(sw?0:-25),'#ffd36e',5);text(ctx,sw?'閉':'開',sx+27,sy-36,12,'#ffd36e','center');
 // 塩橋
 if(bridge){ctx.strokeStyle='#ead9ae';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(lx+bw*.76,by+52);ctx.bezierCurveTo(w*.43,by-120,w*.57,by-120,rx+bw*.24,by+52);ctx.stroke();text(ctx,'塩橋（クリック）',w*.50,by-93,13,'#f2e1b6','center')}else{text(ctx,'塩橋を外しています',w*.50,by-72,13,'#ff9c9c','center')}
 if(active()){
  for(let i=0;i<7;i++){const f=((progress+i*55)%380)/380,x=znX+f*(cuX-znX);ctx.fillStyle='#62e6c7';ctx.beginPath();ctx.arc(x,h*.20,5,0,Math.PI*2);ctx.fill()}
  for(let i=0;i<12;i++){const left=i<6,x=(left?lx:rx)+38+(i%6)*28,y=by+125+((i*17+progress*.35)%65);ctx.fillStyle=i%2?'#72a7ff':'#ff9c9c';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()}
 }
 const dissolve=clamp(progress/1800,0,.34);ctx.fillStyle='rgba(7,17,31,'+dissolve+')';ctx.fillRect(znX-11,by+44,22,bh*.55);ctx.fillStyle='#c87844';ctx.fillRect(cuX-12,by+44,24,Math.min(progress*.015,52));
 voltR.textContent=active()?'1.10 V':'0.00 V';currentR.textContent=active()?'0.18 A':'0.00 A';setRunning(active(),active()?'発電中':sw&&!bridge?'塩橋がないため停止':'回路が開いています');
}
function toggleBridge(){bridge=!bridge;bridgeBtn.textContent=bridge?'塩橋を外す':'塩橋を入れる';draw()}
c.addEventListener('pointerdown',e=>{const p=pointerXY(c,e),r=bridgeHit(c.clientWidth,c.clientHeight);if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)toggleBridge()});
function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;if(active())progress+=dt*70;draw();raf=requestAnimationFrame(loop)}
bridgeBtn.onclick=toggleBridge;start.onclick=()=>{sw=!sw;start.textContent=sw?'スイッチOFF':'スイッチON';draw()};reset.onclick=()=>{sw=false;bridge=true;progress=0;start.textContent='スイッチON';bridgeBtn.textContent='塩橋を外す';draw()};
raf=requestAnimationFrame(loop);return()=>{cancelAnimationFrame(raf);off()}
},

cell(){
let raf,dragStage=false,lastP=null;
controls.innerHTML=group('<span>対物レンズ</span>',`<select id="mag"><option value="40">低倍率 40×</option><option value="100" selected>100×</option><option value="400">高倍率 400×</option></select>`)+slider('stageX','ステージ 横移動',0,100,1,46,'%')+slider('stageY','ステージ 縦移動',0,100,1,72,'%')+slider('coarse','粗動ねじ',0,100,1,54,'')+slider('fine','微動ねじ',0,100,1,52,'')+`<div class="control-group"><button id="homeCell" class="btn secondary full">根の先端付近へ戻す</button><div class="note" style="margin-top:10px">円形の視野をドラッグするとステージが動きます。先に低倍率で位置を決め、粗動→微動の順でピントを合わせます。</div></div>`;
const {c,ctx,off}=canvasSetup('視野をドラッグ＝プレパラートを動かす操作。ピントは粗動ねじ→微動ねじの順に合わせます。');
function viewGeom(){const w=c.clientWidth,h=c.clientHeight;return{cx:w*.68,cy:h*.48,R:Math.min(w*.27,h*.34)}}
function focusError(){const yv=+stageY.value,target=52+(yv-70)*.03;return Math.abs((+coarse.value*.75 + +fine.value*.25)-target)}
function drawMicroscope(w,h){
 // 台座
 ctx.fillStyle='#798896';rr(ctx,w*.06,h*.78,w*.34,h*.055,10);ctx.fill();
 // 鏡柱・アーム
 ctx.strokeStyle='#9ba9b4';ctx.lineWidth=22;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(w*.22,h*.76);ctx.quadraticCurveTo(w*.08,h*.48,w*.22,h*.23);ctx.stroke();ctx.lineCap='butt';
 // 鏡筒
 ctx.save();ctx.translate(w*.25,h*.28);ctx.rotate(-.30);ctx.fillStyle='#d9e0e5';rr(ctx,-20,-80,40,150,9);ctx.fill();ctx.fillStyle='#252e35';rr(ctx,-18,-92,36,35,6);ctx.fill();ctx.restore();
 // レボルバー・対物レンズ
 ctx.fillStyle='#4d5861';ctx.beginPath();ctx.arc(w*.29,h*.37,28,0,Math.PI*2);ctx.fill();
 const lenses=[{dx:-18,len:38},{dx:0,len:50},{dx:18,len:62}];lenses.forEach((o,i)=>{ctx.fillStyle=i===1?'#d7a44b':'#bfc7cc';rr(ctx,w*.285+o.dx-6,h*.39,12,o.len,3);ctx.fill()});
 // ステージ
 ctx.fillStyle='#505d67';rr(ctx,w*.13,h*.53,w*.25,18,3);ctx.fill();ctx.fillStyle='#1b2329';ctx.beginPath();ctx.arc(w*.255,h*.54,12,0,Math.PI*2);ctx.fill();
 // 光源
 ctx.fillStyle='#65747f';ctx.beginPath();ctx.arc(w*.255,h*.68,34,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd36e';ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(w*.255,h*.68,21,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 // 調節ねじ
 ctx.fillStyle='#d0d7dc';ctx.beginPath();ctx.arc(w*.13,h*.40,24,0,Math.PI*2);ctx.fill();ctx.fillStyle='#596670';ctx.beginPath();ctx.arc(w*.13,h*.40,12,0,Math.PI*2);ctx.fill();text(ctx,'粗',w*.13,h*.405,11,'#eef7ff','center');
 ctx.fillStyle='#d0d7dc';ctx.beginPath();ctx.arc(w*.175,h*.44,16,0,Math.PI*2);ctx.fill();text(ctx,'微',w*.175,h*.445,10,'#25313a','center');
 text(ctx,'顕微鏡',w*.21,h*.90,16,'#9fb4c9','center');
}
function draw(){
 const w=c.clientWidth,h=c.clientHeight,m=+mag.value,xv=+stageX.value,yv=+stageY.value,{cx,cy,R}=viewGeom(),fe=focusError();ctx.clearRect(0,0,w,h);drawMicroscope(w,h);
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();ctx.fillStyle='#f4d7ca';ctx.fillRect(cx-R,cy-R,R*2,R*2);ctx.filter=`blur(${clamp(fe/5,0,6)}px)`;
 const cell=m===400?88:m===100?48:25,scale=m/100,ox=(xv-50)*5*scale,oy=(yv-50)*5*scale;
 for(let yy=cy-R-cell;yy<cy+R+cell;yy+=cell*.74){for(let xx=cx-R-cell;xx<cx+R+cell;xx+=cell){const px=xx+((Math.floor(yy/cell)%2)*cell*.28)+ox%cell,py=yy+oy%cell;ctx.strokeStyle='rgba(120,68,83,.36)';ctx.lineWidth=2;ctx.strokeRect(px,py,cell*.9,cell*.67);const inDivisionZone=yv>58&&yv<90,seed=(Math.floor((px-ox)/cell)*37+Math.floor((py-oy)/cell)*19);if(inDivisionZone&&seed%7===0){ctx.strokeStyle='#57205f';ctx.lineWidth=3;const type=Math.abs(seed)%4;if(type===0){line(ctx,px+cell*.25,py+cell*.20,px+cell*.65,py+cell*.46,'#57205f',3);line(ctx,px+cell*.65,py+cell*.20,px+cell*.30,py+cell*.48,'#57205f',3)}else if(type===1){line(ctx,px+cell*.48,py+cell*.15,px+cell*.48,py+cell*.52,'#57205f',4)}else if(type===2){ctx.beginPath();ctx.arc(px+cell*.35,py+cell*.34,cell*.10,0,Math.PI*2);ctx.arc(px+cell*.60,py+cell*.34,cell*.10,0,Math.PI*2);ctx.stroke()}else{ctx.fillStyle='#7b3f81';ctx.beginPath();ctx.ellipse(px+cell*.46,py+cell*.34,cell*.18,cell*.09,.5,0,Math.PI*2);ctx.fill()}}else{ctx.fillStyle='rgba(126,73,105,.42)';ctx.beginPath();ctx.arc(px+cell*.45,py+cell*.34,cell*.09,0,Math.PI*2);ctx.fill()}}}
 ctx.restore();ctx.strokeStyle='#d7e7f6';ctx.lineWidth=8;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
 text(ctx,`${m}×`,cx+R*.65,cy+R*.84,18,'#62e6c7','center');text(ctx,fe<2?'ピント良好':fe<6?'あと少し':'ぼけています',cx-R*.55,cy+R*.84,15,fe<2?'#62e6c7':'#ffd36e','center');text(ctx,'視野をドラッグ',cx,cy-R-22,13,'#ffd36e','center');setRunning(true,'観察中');
}
function syncStageLabels(){stageXVal.textContent=stageX.value+'%';stageYVal.textContent=stageY.value+'%'}
c.addEventListener('pointerdown',e=>{const p=pointerXY(c,e),{cx,cy,R}=viewGeom();if(Math.hypot(p.x-cx,p.y-cy)<=R){dragStage=true;lastP=p;c.setPointerCapture(e.pointerId)}});
c.addEventListener('pointermove',e=>{if(!dragStage)return;const p=pointerXY(c,e),m=+mag.value,sens=m===400?.08:m===100?.16:.30;stageX.value=clamp(+stageX.value-(p.x-lastP.x)*sens,0,100);stageY.value=clamp(+stageY.value-(p.y-lastP.y)*sens,0,100);lastP=p;syncStageLabels();draw()});c.addEventListener('pointerup',()=>dragStage=false);c.addEventListener('pointercancel',()=>dragStage=false);
c.addEventListener('wheel',e=>{const p=pointerXY(c,e),{cx,cy,R}=viewGeom();if(Math.hypot(p.x-cx,p.y-cy)<=R){e.preventDefault();fine.value=clamp(+fine.value+(e.deltaY>0?1:-1),0,100);fineVal.textContent=fine.value;draw()}},{passive:false});
['stageX','stageY','coarse','fine'].forEach(id=>document.querySelector('#'+id).oninput=()=>{document.querySelector('#'+id+'Val').textContent=document.querySelector('#'+id).value+(id.startsWith('stage')?'%':'');draw()});mag.onchange=draw;
homeCell.onclick=()=>{stageX.value=46;stageY.value=72;coarse.value=54;fine.value=52;syncStageLabels();coarseVal.textContent='54';fineVal.textContent='52';draw()};
function loop(){draw();raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);return()=>{cancelAnimationFrame(raf);off()}
},

sky(){
let hour=6,run=false,marks=[],raf,last=performance.now();
controls.innerHTML=group('<span>季節</span>',`<select id="season"><option>春分</option><option>夏至</option><option>秋分</option><option>冬至</option></select>`)+slider('hour','時刻',4,20,.25,6,'時')+group('<span>透明半球に記録</span>',`<button id="markSun" class="btn full">現在の位置に点を打つ</button>`)+buttons('時間を進める')+`<div class="readout"><div class="meter"><span>方位</span><b id="azR">東</b></div><div class="meter"><span>高度</span><b id="altR">0°</b></div></div>`;
const {
c,ctx,off}
=canvasSetup('時刻を動かして「点を打つ」。複数点を記録すると太陽の道筋が見えます。');

function sunAt(hr){
const decs={
春分:0,夏至:23.44,秋分:0,冬至:-23.44}
;
const lat=34.4*Math.PI/180,dec=decs[season.value]*Math.PI/180,H=(hr-12)*15*Math.PI/180;
const east=-Math.cos(dec)*Math.sin(H),north=Math.cos(lat)*Math.sin(dec)-Math.sin(lat)*Math.cos(dec)*Math.cos(H),up=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(H);
const alt=Math.asin(clamp(up,-1,1))*180/Math.PI;
let az=Math.atan2(east,north)*180/Math.PI;
if(az<0)az+=360;
return{
visible:alt>=0,alt,az}
}

function pt(s,w,h){
const cx=w/2,cy=h*.70,R=Math.min(w*.34,h*.40),Ry=R*.28,az=s.az*Math.PI/180,alt=s.alt*Math.PI/180;
const x=cx-R*Math.cos(alt)*Math.sin(az),y=cy-Ry*Math.cos(alt)*Math.cos(az)-R*.92*Math.sin(alt);
return{
x,y,cx,cy,R,Ry}
}

function draw(){
const w=c.clientWidth,h=c.clientHeight;
ctx.clearRect(0,0,w,h);
const cx=w/2,cy=h*.70,R=Math.min(w*.34,h*.40),Ry=R*.28;
ctx.strokeStyle='rgba(215,231,246,.28)';
ctx.lineWidth=2;
ctx.beginPath();
ctx.ellipse(cx,cy,R,Ry,0,0,Math.PI*2);
ctx.stroke();
ctx.beginPath();
ctx.ellipse(cx,cy,R,R*.92,0,Math.PI,0);
ctx.stroke();
ctx.beginPath();
ctx.ellipse(cx,cy,R*.55,R*.92,0,Math.PI,0);
ctx.stroke();
line(ctx,cx-R,cy,cx+R,cy,'rgba(255,255,255,.14)',1);
line(ctx,cx,cy-Ry,cx,cy+Ry,'rgba(255,255,255,.14)',1);
text(ctx,'東',cx-R-22,cy+5,16,'#9fb4c9','center');
text(ctx,'西',cx+R+22,cy+5,16,'#9fb4c9','center');
text(ctx,'北',cx,cy-Ry-18,15,'#9fb4c9','center');
text(ctx,'南',cx,cy+Ry+24,16,'#9fb4c9','center');
marks.filter(m=>m.season===season.value).forEach((m,i,arr)=>{
const p=pt(m,w,h);
ctx.fillStyle='#ff9f7a';
ctx.beginPath();
ctx.arc(p.x,p.y,5,0,Math.PI*2);
ctx.fill();
if(i>0){
const q=pt(arr[i-1],w,h);
line(ctx,q.x,q.y,p.x,p.y,'rgba(255,159,122,.45)',2)}
}
);
const s=sunAt(hour);
if(s.visible){
const p=pt(s,w,h);
ctx.fillStyle='#ffd36e';
ctx.shadowColor='#ffd36e';
ctx.shadowBlur=28;
ctx.beginPath();
ctx.arc(p.x,p.y,18,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
line(ctx,p.x,p.y,p.x,cy,'rgba(255,211,110,.2)',1)}
text(ctx,season.value,cx,h*.12,22,'#eef7ff','center');
azR.textContent=s.visible?(s.az<135?'東':s.az>225?'西':'南'):'地平線下';
altR.textContent=Math.max(0,s.alt).toFixed(0)+'°';
setRunning(run,run?'時間経過中':'観察中')}

function loop(now){
const dt=Math.min((now-last)/1000,.04);
last=now;
if(run){
hour+=dt*1.2;
if(hour>20)hour=4;
document.querySelector('#hour').value=hour;
hourVal.textContent=hour.toFixed(2)+'時'}
draw();
raf=requestAnimationFrame(loop)}
hour.oninput=()=>{
hour=+document.querySelector('#hour').value;
hourVal.textContent=hour+'時';
draw()}
;
season.onchange=()=>{
marks=[];
draw()}
;
markSun.onclick=()=>{
const s=sunAt(hour);
if(s.visible){
marks.push({
...s,hour,season:season.value}
);
marks.sort((a,b)=>a.hour-b.hour);
draw()}
}
;
start.onclick=()=>{
run=!run;
start.textContent=run?'停止':'時間を進める'}
;
reset.onclick=()=>{
run=false;
hour=6;
marks=[];
document.querySelector('#hour').value=6;
hourVal.textContent='6時';
start.textContent='時間を進める';
draw()}
;
raf=requestAnimationFrame(loop);
return()=>{
cancelAnimationFrame(raf);
off()}
}

}
;

if(location.hash){
const l=labs.find(x=>'#'+x.id===location.hash);
if(l)setTimeout(()=>openLab(l),80)}

</script>
