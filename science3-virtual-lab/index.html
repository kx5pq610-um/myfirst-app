<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中学3年理科 バーチャル実験室｜啓林館教科書準拠</title>
<meta name="description" content="啓林館 中学3年理科の観察・実験を、実際の器具・操作に沿ってブラウザ上で再現するバーチャル実験室。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">SCIENCE 3 · VIRTUAL LAB</div>
    <h1>中学3年理科<br><span>バーチャル実験室</span></h1>
    <p>啓林館の教科書に載っている観察・実験の<strong>器具・操作・現象</strong>を基準に再現します。<br>結果を見る動画ではなく、自分で器具を操作するための環境です。</p>
    <a class="primary" href="#labs">実験を選ぶ</a>
  </div>
</header>
<main>
<section class="intro">
  <div><div class="kicker">TEXTBOOK ALIGNED</div><h2>教科書と同じ実験を</h2></div>
  <p>説明問題や記録提出機能は付けていません。欠席時でも、実際の授業で行う操作に近い体験ができることを優先しています。</p>
</section>
<section id="labs" class="section">
  <div class="kicker">LABS & OBSERVATIONS</div><h2>観察・実験一覧</h2>
  <div id="filters" class="filters"></div>
  <div id="labGrid" class="lab-grid"></div>
</section>
<section id="labArea" class="lab-area hidden">
  <div class="lab-head">
    <div>
      <button id="backBtn" class="ghost">← 一覧へ</button>
      <div id="labMeta" class="meta"></div>
      <h2 id="labTitle"></h2><p id="labDesc" class="desc"></p>
    </div>
    <div id="status" class="status">準備</div>
  </div>
  <div class="sim-shell"><div id="stage" class="stage"></div><aside id="controls" class="controls"></aside></div>
</section>
</main>
<footer><strong>中学3年理科 バーチャル実験室</strong><span>啓林館教科書の観察・実験をもとにした自作シミュレーション</span></footer>
<script src="app.js"></script>
</body></html>
